<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380">
  <defs>
    <!-- Soft luxury gold and crimson stroke styles -->
    <style>
      .gold-stroke {
        stroke: #C5A059;
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        opacity: 0.22;
      }
      .gold-fill {
        fill: #C5A059;
        opacity: 0.16;
      }
      .crimson-stroke {
        stroke: #6B1724;
        stroke-width: 1.3;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        opacity: 0.16;
      }
      .crimson-fill {
        fill: #6B1724;
        opacity: 0.12;
      }
      .sparkle {
        fill: #C5A059;
        opacity: 0.25;
      }
      .dot {
        fill: #C5A059;
        opacity: 0.22;
      }
    </style>
  </defs>

  <!-- ========================================================
       1. WEDDING INVITATION CARD & ENVELOPE (Top-Left)
       ======================================================== -->
  <g class="gold-stroke">
    <!-- Envelope Base -->
    <path d="M 32,58 L 78,58 L 78,90 L 32,90 Z" />
    <!-- V-Flap -->
    <path d="M 32,58 L 55,74 L 78,58" />
    <!-- Lower Diagonal Folds -->
    <path d="M 32,90 L 49,70 M 78,90 L 61,70" />
    <!-- Invitation Card Peeking Out -->
    <path d="M 38,42 L 72,42 L 72,58 L 38,58 Z" />
    <!-- Elegant Card Header Lines -->
    <path d="M 46,47 L 64,47 M 48,51 L 62,51" stroke-width="1.1" />
  </g>
  <!-- Wax Seal -->
  <circle cx="55" cy="74" r="4.2" class="crimson-fill" />
  <circle cx="55" cy="74" r="4.2" class="crimson-stroke" />
  <circle cx="55" cy="74" r="1.5" class="gold-fill" />

  <!-- ========================================================
       2. LUXURY GIFT HAMPER / PRESENT BOX (Top-Right)
       ======================================================== -->
  <g class="gold-stroke">
    <!-- Box Body -->
    <rect x="235" y="52" width="48" height="42" rx="3" />
    <!-- Box Lid -->
    <rect x="231" y="45" width="56" height="9" rx="2" />
    <!-- Vertical Ribbon -->
    <path d="M 259,45 L 259,94" />
    <!-- Horizontal Ribbon -->
    <path d="M 235,71 L 283,71" />
    <!-- Ribbon Bow - Left Loop -->
    <path d="M 259,45 C 248,34 243,43 259,45" />
    <!-- Ribbon Bow - Right Loop -->
    <path d="M 259,45 C 270,34 275,43 259,45" />
    <!-- Ribbon Tails -->
    <path d="M 256,45 C 251,52 247,53 245,55" />
    <path d="M 262,45 C 267,52 271,53 273,55" />
  </g>
  <circle cx="259" cy="45" r="2.2" class="gold-fill" />

  <!-- ========================================================
       3. BOTANICAL ROSE & FLOWER BOUQUET (Center)
       ======================================================== -->
  <g class="crimson-stroke">
    <!-- Rose Blossom Core -->
    <path d="M 152,145 C 146,140 156,134 160,140 C 164,145 156,152 149,148 C 144,144 146,137 154,136" />
    <!-- Petal Layers -->
    <path d="M 148,138 C 143,142 144,151 152,153 C 160,154 166,147 164,139" />
    <path d="M 144,145 C 142,154 151,159 160,157 C 167,154 169,144 163,136" />
    <!-- Stem & Leaves -->
    <path d="M 154,158 C 153,172 147,184 140,192" />
  </g>
  <g class="gold-stroke">
    <!-- Left Leaf -->
    <path d="M 152,168 C 144,166 141,173 147,176 C 152,178 152,170 152,168" />
    <path d="M 147,172 L 151,170" stroke-width="0.8" />
    <!-- Right Leaf -->
    <path d="M 149,176 C 157,178 160,185 154,188 C 148,189 148,180 149,176" />
    <path d="M 151,180 L 155,183" stroke-width="0.8" />
    <!-- Small Bud on side -->
    <path d="M 166,148 C 171,143 177,146 175,152 C 172,156 168,154 166,148" />
    <path d="M 163,153 C 166,155 170,158 171,162" />
  </g>

  <!-- ========================================================
       4. INTERLINKED WEDDING BANDS / RINGS (Mid-Right)
       ======================================================== -->
  <g class="gold-stroke">
    <circle cx="316" cy="162" r="9.5" />
    <circle cx="328" cy="162" r="9.5" />
    <!-- Diamond Gem Sparkle on Bride's Band -->
    <path d="M 316,150 L 319,152.5 L 316,155 L 313,152.5 Z" class="gold-fill" />
  </g>

  <!-- ========================================================
       5. FLOWING SILK RIBBON & BOW SWAG (Mid-Left)
       ======================================================== -->
  <g class="crimson-stroke">
    <path d="M 30,215 C 48,203 62,230 84,216 C 96,208 106,215 116,211" />
    <path d="M 33,220 C 51,208 65,235 87,221 C 99,213 109,220 119,216" />
    <!-- Ribbon End Cuts -->
    <path d="M 30,215 L 33,220 M 116,211 L 119,216" />
  </g>
  <!-- Mini Ribbon Bow -->
  <g class="gold-stroke">
    <path d="M 72,218 C 65,210 63,222 72,218" />
    <path d="M 72,218 C 79,210 81,222 72,218" />
  </g>

  <!-- ========================================================
       6. WOVEN GIFT HAMPER / BASKET (Bottom-Right)
       ======================================================== -->
  <g class="gold-stroke">
    <!-- Basket Outline -->
    <path d="M 238,252 L 282,252 L 276,290 L 244,290 Z" />
    <!-- Woven Grid Lines -->
    <path d="M 240,264 L 280,264 M 242,277 L 278,277" stroke-width="1.1" />
    <path d="M 252,252 L 254,290 M 268,252 L 266,290" stroke-width="1.1" />
    <!-- Basket Arch Handle -->
    <path d="M 247,252 C 247,236 273,236 273,252" />
  </g>
  <!-- Flowers Overflowing the Hamper -->
  <circle cx="253" cy="248" r="4.5" class="crimson-fill" />
  <circle cx="264" cy="246" r="3.8" class="gold-fill" />
  <path d="M 253,243 C 253,240 258,241 257,245" class="gold-stroke" />

  <!-- ========================================================
       7. OLIVE / LAUREL BOTANICAL SPRIG (Bottom-Left)
       ======================================================== -->
  <g class="gold-stroke">
    <path d="M 36,335 C 56,328 78,312 98,300" />
    <!-- Leaf Pairs -->
    <path d="M 48,330 C 47,322 55,324 54,329" />
    <path d="M 52,329 C 55,335 62,333 59,328" />
    <path d="M 64,323 C 65,315 73,317 71,322" />
    <path d="M 69,321 C 72,328 79,325 76,320" />
    <path d="M 80,314 C 83,306 91,308 88,313" />
    <path d="M 86,312 C 89,318 96,315 93,310" />
    <!-- Top Tip Leaf -->
    <path d="M 98,300 C 104,295 107,301 100,304" />
  </g>

  <!-- ========================================================
       8. CELEBRATION TOASTING FLUTES (Bottom-Center)
       ======================================================== -->
  <g class="gold-stroke">
    <!-- Left Champagne Glass -->
    <path d="M 166,282 L 170,305 L 168,317" />
    <path d="M 170,305 L 172,305 M 163,317 L 173,317" />
    <path d="M 164,282 C 164,277 172,277 172,282" />
    <!-- Right Champagne Glass (Tilted) -->
    <path d="M 184,283 L 180,305 L 182,317" />
    <path d="M 180,305 L 178,305 M 177,317 L 187,317" />
    <path d="M 186,283 C 186,278 178,278 178,283" />
    <!-- Toast Clink Sparkles -->
    <path d="M 175,273 L 175,269 M 172,271 L 178,271" stroke-width="1.1" />
  </g>
  <circle cx="168" cy="288" r="0.8" class="dot" />
  <circle cx="182" cy="290" r="0.8" class="dot" />

  <!-- ========================================================
       9. ELEGANT STATIONERY SCROLL & SEAL (Top-Center)
       ======================================================== -->
  <g class="gold-stroke">
    <!-- Rolled Scroll -->
    <path d="M 148,68 C 144,68 144,76 148,76 L 185,76 C 189,76 189,68 185,68 Z" />
    <path d="M 148,68 C 151,68 151,76 148,76" />
    <!-- Ribbon Wrapped Around Scroll -->
    <path d="M 164,68 L 164,76" class="crimson-stroke" stroke-width="2" />
    <!-- Ribbon Tails -->
    <path d="M 163,76 C 161,82 158,84 156,86" class="crimson-stroke" />
    <path d="M 165,76 C 167,82 170,84 172,86" class="crimson-stroke" />
  </g>

  <!-- ========================================================
       10. DELICATE 4-POINT SPARKLES & STARS (Evenly Distributed)
       ======================================================== -->
  <!-- Sparkle 1 (Near Invitation) -->
  <path d="M 108,72 Q 108,77 113,77 Q 108,77 108,82 Q 108,77 103,77 Q 108,77 108,72 Z" class="sparkle" />
  <!-- Sparkle 2 (Near Gift Box) -->
  <path d="M 312,88 Q 312,92 316,92 Q 312,92 312,96 Q 312,92 308,92 Q 312,92 312,88 Z" class="sparkle" />
  <!-- Sparkle 3 (Upper Center) -->
  <path d="M 198,105 Q 198,109 202,109 Q 198,109 198,113 Q 198,109 194,109 Q 198,109 198,105 Z" class="sparkle" />
  <!-- Sparkle 4 (Mid-Left) -->
  <path d="M 82,165 Q 82,169 86,169 Q 82,169 82,173 Q 82,169 78,169 Q 82,169 82,165 Z" class="sparkle" />
  <!-- Sparkle 5 (Center-Right) -->
  <path d="M 226,182 Q 226,186 230,186 Q 226,186 226,190 Q 226,186 222,186 Q 226,186 226,182 Z" class="sparkle" />
  <!-- Sparkle 6 (Lower-Left) -->
  <path d="M 125,258 Q 125,262 129,262 Q 125,262 125,266 Q 125,262 121,262 Q 125,262 125,258 Z" class="sparkle" />
  <!-- Sparkle 7 (Lower-Right) -->
  <path d="M 328,268 Q 328,272 332,272 Q 328,272 328,276 Q 328,272 324,272 Q 328,272 328,268 Z" class="sparkle" />
  <!-- Sparkle 8 (Near Bottom Laurel) -->
  <path d="M 58,285 Q 58,289 62,289 Q 58,289 58,293 Q 58,289 54,289 Q 58,289 58,285 Z" class="sparkle" />

  <!-- Subtle Starlight Accent Dots -->
  <circle cx="120" cy="120" r="1.3" class="dot" />
  <circle cx="295" cy="125" r="1.3" class="dot" />
  <circle cx="190" cy="225" r="1.3" class="dot" />
  <circle cx="340" cy="215" r="1.3" class="dot" />
  <circle cx="95" cy="265" r="1.3" class="dot" />
  <circle cx="215" cy="315" r="1.3" class="dot" />
  <circle cx="305" cy="335" r="1.3" class="dot" />
  <circle cx="140" cy="330" r="1.3" class="dot" />
</svg>