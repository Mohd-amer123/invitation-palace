<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | THE INVITATION PALACE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --palace-burgundy: #6b1724;
      --palace-burgundy-hover: #54101b;
      --palace-burgundy-light: rgba(107, 23, 36, 0.08);
      --palace-gold: #D4AF37;
      --palace-gold-light: #FBF6E9;
      --palace-charcoal: #1E1E24;
      --palace-muted: #8E8E93;
      --palace-border: #E5E5EA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #140C0E;
      font-family: 'Montserrat', sans-serif;
      padding: 24px 16px;
      color: var(--palace-charcoal);
      position: relative;
      overflow-x: hidden;
    }

    /* Showroom Background with Low Opacity */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('images/login-bg.jpg?v=1') center center / cover no-repeat;
      opacity: 0.38;
      z-index: 0;
      pointer-events: none;
    }

    /* Ambient Warm Vignette Overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(20, 12, 14, 0.3) 0%, rgba(20, 12, 14, 0.75) 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* Main Modal Card */
    .login-wrapper {
      max-width: 940px;
      width: 100%;
      min-height: 560px;
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.45), 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      position: relative;
      z-index: 1;
    }

    /* Left Side - Pure Hero Wedding Image */
    .login-hero {
      flex: 1.15;
      position: relative;
      background: url('images/login-hero.jpg?v=2') center center / cover no-repeat;
      overflow: hidden;
      min-height: 560px;
    }

    /* Right Side - Clean Minimalist Login Form */
    .login-form-pane {
      flex: 1;
      padding: 56px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #FFFFFF;
      position: relative;
    }

    .login-header-title {
      font-size: 36px;
      font-weight: 700;
      color: #1A1A1A;
      margin-bottom: 6px;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: -0.5px;
    }

    .login-header-desc {
      font-size: 13px;
      color: var(--palace-muted);
      margin-bottom: 36px;
    }

    /* Minimal Underline Input Style */
    .custom-input-group {
      position: relative;
      margin-bottom: 28px;
    }

    .custom-input-label {
      font-size: 13px;
      font-weight: 500;
      color: #6C757D;
      display: block;
      margin-bottom: 6px;
      transition: color 0.2s ease;
    }

    .custom-input-group:focus-within .custom-input-label {
      color: var(--palace-burgundy);
      font-weight: 600;
    }

    .custom-input-field {
      width: 100%;
      border: none;
      border-bottom: 1.5px solid var(--palace-border);
      padding: 10px 0;
      font-size: 15px;
      font-weight: 500;
      color: #1A1A1A;
      background: transparent;
      outline: none;
      transition: border-color 0.25s ease;
      font-family: 'Montserrat', sans-serif;
    }

    .custom-input-field:focus {
      border-bottom-color: var(--palace-burgundy);
    }

    .custom-input-field::placeholder {
      color: #BBB;
      font-weight: 400;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-pass-btn {
      position: absolute;
      right: 0;
      bottom: 10px;
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-pass-btn:hover {
      color: var(--palace-burgundy);
    }

    .forgot-link {
      font-size: 12px;
      color: #777;
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: var(--palace-burgundy);
      text-decoration: underline;
    }

    /* Primary Login Button (#6b1724) */
    .btn-login {
      width: 100%;
      background-color: #6b1724;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 12px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(107, 23, 36, 0.25);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      background-color: #54101b;
      box-shadow: 0 10px 24px rgba(107, 23, 36, 0.35);
      transform: translateY(-1px);
      color: #FFFFFF;
    }

    .btn-login:active {
      transform: translateY(1px);
    }

    .btn-login:disabled {
      background-color: #9E5B66;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Default Credential Pill */
    .cred-pill {
      background: #F8F9FA;
      border: 1px dashed #D1D5DB;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 11.5px;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .cred-pill code {
      color: var(--palace-burgundy);
      font-weight: 600;
      background: rgba(107, 23, 36, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Form Footer */
    .form-footer {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: auto;
    }

    .form-footer strong {
      color: var(--palace-burgundy);
      font-weight: 600;
    }

    /* Alert Box */
    .custom-alert {
      background: #FFF1F0;
      border: 1px solid #FFCCC7;
      color: #CF1322;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12.5px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes fadeInHero {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive Breakdown */
    @media (max-width: 820px) {
      .login-wrapper {
        flex-direction: column;
        max-width: 460px;
        min-height: auto;
        border-radius: 22px;
      }

      .login-hero {
        min-height: 240px;
        padding: 32px 20px;
      }

      .hero-welcome {
        font-size: 26px;
        letter-spacing: 6px;
      }

      .login-form-pane {
        padding: 36px 28px;
      }

      .login-header-title {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <!-- Left Hero Image Column (Pure Wedding Stationery Image) -->
    <div class="login-hero" role="img" aria-label="Luxury Wedding Stationery"></div>

    <!-- Right Login Form Column -->
    <div class="login-form-pane">
      <h2 class="login-header-title">Login</h2>
      <p class="login-header-desc">Enter your administrator credentials to continue</p>

      <!-- Dynamic Alert Container -->
      <div id="loginAlert" class="custom-alert d-none">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="loginAlertText">Invalid username or password.</span>
      </div>

      <form id="loginForm" autocomplete="on">
        <!-- Email / Username -->
        <div class="custom-input-group">
          <label class="custom-input-label" for="username">Email / Username</label>
          <input 
            type="text" 
            class="custom-input-field" 
            id="username" 
            name="username" 
            placeholder="Enter your email or username" 
            autocomplete="username" 
            required 
            autofocus>
        </div>

        <!-- Password -->
        <div class="custom-input-group">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="custom-input-label m-0" for="password">Password</label>
            <a href="javascript:void(0)" class="forgot-link" onclick="handleForgotPassword()">Forgot password?</a>
          </div>
          <div class="password-wrapper">
            <input 
              type="password" 
              class="custom-input-field" 
              id="password" 
              name="password" 
              placeholder="Enter your password" 
              autocomplete="current-password" 
              required>
            <button type="button" class="toggle-pass-btn" id="togglePasswordBtn" title="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button in #6b1724 -->
        <button type="submit" class="btn-login" id="submitBtn">
          <span>Login</span>
          <i class="fa-solid fa-arrow-right-long ms-1"></i>
        </button>
      </form>

      <div class="form-footer">
        <span>Powered by <strong>THE INVITATION PALACE</strong></span>
        <div class="text-muted mt-1" style="font-size: 11px;">
          <i class="fa-solid fa-shield-halved text-success me-1"></i> End-to-End Encrypted Session
        </div>
      </div>
    </div>
  </div>

  <script>
    // Password toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', () => {
        const isPass = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPass ? 'text' : 'password');
        toggleBtn.innerHTML = isPass ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
      });
    }

    // Forgot password info toast
    function handleForgotPassword() {
      alert('To reset your administrator password, please contact your system administrator.');
    }

    // Handle Login Submit
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');
    const alertText = document.getElementById('loginAlertText');
    const submitBtn = document.getElementById('submitBtn');

    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Logging in...';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();

          if (response.ok && data.success) {
            submitBtn.innerHTML = '<i class="fa-solid fa-check me-2"></i> Success!';
            window.location.href = '/index.html';
          } else {
            alertText.textContent = data.error || 'Invalid username or password.';
            alertBox.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Login</span> <i class="fa-solid fa-arrow-right-long ms-1"></i>';
          }
        } catch (err) {
          alertText.textContent = 'Server connection error. Please verify the server is running.';
          alertBox.classList.remove('d-none');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Login</span> <i class="fa-solid fa-arrow-right-long ms-1"></i>';
        }
      });
    }

    // Load Public Branding
    (async function loadPublicBranding() {
      try {
        const res = await fetch('/api/settings/public');
        const data = await res.json();
        if (data.success && data.settings) {
          if (data.settings.business_name) {
            const bName = data.settings.business_name;
            const heroBrand = document.getElementById('loginHeroBrand');
            if (heroBrand) heroBrand.textContent = bName;
            document.title = `Login | ${bName}`;
          }
        }
      } catch (e) {
        // Fallback to default branding
      }
    })();
  </script>
</body>
</html>
