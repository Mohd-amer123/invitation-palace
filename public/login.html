<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | THE INVITATION PALACE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #FAF7F2 0%, #EFE8DD 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      max-width: 440px;
      width: 100%;
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      border: 1px solid var(--palace-gold-light);
      box-shadow: 0 10px 40px rgba(74, 14, 24, 0.12);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(180deg, var(--palace-burgundy-dark) 0%, var(--palace-burgundy) 100%);
      color: #FFF;
      text-align: center;
      padding: 32px 24px 28px;
      border-bottom: 3px solid var(--palace-gold);
    }
    .login-header i {
      font-size: 34px;
      color: var(--palace-gold-light);
      margin-bottom: 10px;
    }
    .login-body {
      padding: 32px 28px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div id="loginCrestWrapper">
        <i class="fa-solid fa-crown" id="loginCrownIcon"></i>
        <img id="loginCompanyLogo" src="" alt="Company Logo" class="d-none" style="max-height: 60px; max-width: 180px; object-fit: contain; margin-bottom: 12px; background: rgba(255,255,255,0.95); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--palace-gold);">
      </div>
      <h3 class="text-white mb-1" id="loginBrandName" style="font-family: var(--font-serif); font-size: 22px; letter-spacing: 1.5px;">THE INVITATION PALACE</h3>
      <div id="loginBrandSubtitle" style="font-size: 11px; color: var(--palace-gold-light); text-transform: uppercase; letter-spacing: 1.2px;">
        WhatsApp Event Reminder Management System
      </div>
    </div>

    <div class="login-body">
      <div id="loginAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Admin Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Enter username" value="admin" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Enter password" value="admin123" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <span class="badge bg-light text-dark border p-2 text-wrap" style="font-size: 11px;">
            <i class="fa-solid fa-shield-halved text-success me-1"></i> Default: <code>admin</code> / <code>admin123</code>
          </span>
        </div>

        <button type="submit" class="btn btn-palace w-100 py-2" id="submitBtn">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Palace Admin
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center text-muted" style="font-size: 11.5px;">
        <i class="fa-solid fa-lock text-success me-1"></i> 100% Free & Open Source Local Storage (Zero Cloud Cost)
      </div>
    </div>
  </div>

  <script>
    // Toggle password visibility
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      toggleBtn.innerHTML = type === 'password' ? '<i class="fa-regular fa-eye"></i>' : '<i class="fa-regular fa-eye-slash"></i>';
    });

    // Handle Login Submit
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Verifying...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          window.location.href = '/index.html';
        } else {
          alertBox.textContent = data.error || 'Invalid username or password.';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertBox.textContent = 'Network or server error. Please ensure the local server is running.';
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Palace Admin';
      }
    });

    // Load Public Branding (Company Logo, Name & Tagline)
    (async function loadPublicBranding() {
      try {
        const res = await fetch('/api/settings/public');
        const data = await res.json();
        if (data.success && data.settings) {
          const s = data.settings;
          if (s.business_name) {
            document.getElementById('loginBrandName').textContent = s.business_name;
            document.title = 'Login | ' + s.business_name;
          }
          if (s.business_tagline) {
            document.getElementById('loginBrandSubtitle').textContent = s.business_tagline;
          }
          if (s.company_logo) {
            const logoImg = document.getElementById('loginCompanyLogo');
            const crownIcon = document.getElementById('loginCrownIcon');
            logoImg.src = s.company_logo;
            logoImg.classList.remove('d-none');
            crownIcon.classList.add('d-none');
          }
        }
      } catch (err) {
        console.warn('Could not load public branding:', err);
      }
    })();
  </script>
</body>
</html>
